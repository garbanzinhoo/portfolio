<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Ticket no encontrado — Aitor Zoilo Burgos</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/print.css" media="print" />
</head>
<body>
<main style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem;">
  <div class="ticket" style="text-align:left;">
    <header class="ticket__head">
      <span class="ticket__id">AITOR-404</span>
      <span class="pill pill--backlog">
        <span class="dot dot--backlog" aria-hidden="true"></span>
        No encontrado
      </span>
    </header>
    <h1 class="ticket__title">404 — Ticket no encontrado</h1>
    <p style="color:var(--ink-soft); max-width:60ch;">
      Este ticket no existe en el board — puede que el enlace esté roto o que
      se haya movido.
    </p>
    <p class="ticket__note" style="font-style: normal; margin-top: 0.75rem;">
      This ticket doesn't exist on the board — the link may be broken or moved.
    </p>
    <p style="margin-top:2rem;">
      <a class="btn btn--primary" href="index.html">Volver al board</a>
    </p>
  </div>
</main>
</body>
</html>
