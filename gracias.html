<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensaje enviado — Aitor Zoilo Burgos</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .thanks {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }
    .thanks h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .thanks p { color: var(--text-muted); max-width: 42ch; }
    .thanks .accent { font-family: var(--font-mono); }
  </style>
</head>
<body>
  <main class="thanks">
    <p class="accent">&gt; mensaje recibido</p>
    <h1>¡Gracias! Te responderé pronto.</h1>
    <p>Tu mensaje se ha enviado correctamente. Mientras tanto, puedes volver al inicio.</p>
    <a href="/" class="btn btn-primary">Volver al portfolio</a>
  </main>
</body>
</html>
